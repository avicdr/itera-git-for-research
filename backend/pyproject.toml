[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgit"
version = "0.1.0"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13", "pydantic-settings>=2.4", "python-multipart>=0.0.9", "pymupdf>=1.24", "pgvector>=0.3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[project.scripts]
researchgit-seed = "researchgit.seed:main"

[tool.setuptools.packages.find]
include = ["researchgit*"]
