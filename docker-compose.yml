services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchgit
      POSTGRES_PASSWORD: researchgit
      POSTGRES_DB: researchgit
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchgit"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    volumes: ["./backend/storage:/app/storage"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./web
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [backend]
